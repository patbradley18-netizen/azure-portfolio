name: build-14 loader image

on:
  push:
    branches: [main]
    paths: ["build-14-ingestion/loader/**", ".github/workflows/build-loader-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret-shape gate (same rule as the site deploy)
        run: |
          if grep -rEn "(AccountKey=|SharedAccessSignature=|sig=[A-Za-z0-9%]{20,}|eyJ[A-Za-z0-9_-]{30,})" build-14-ingestion/loader; then
            echo "::error::secret-shaped string found; refusing to build"; exit 1; fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: build-14-ingestion/loader
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/azportfolio-loader:latest
            ghcr.io/${{ github.repository_owner }}/azportfolio-loader:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Azure learning portfolio build #14 loader (no secrets; managed identity at run time)
